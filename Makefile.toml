[config]
default_to_workspace = false

[env]
RUST_BACKTRACE = "1"

# ============================================================
# Compile
# ============================================================

[tasks.compile-check]
description = "Compile-check all targets"
category = "Build"
command = "cargo"
args = [
    "check",
    "--workspace",
    "--all-targets",
    "--all-features",
]

# ============================================================
# Format
# ============================================================

[tasks.format-check]
description = "Verify Rust source formatting"
category = "Quality"
command = "cargo"
args = [
    "fmt",
    "--all",
    "--",
    "--check",
]

# ============================================================
# Clippy
# ============================================================

[tasks.clippy-check]
description = "Run Clippy with warnings denied"
category = "Quality"
command = "cargo"
args = [
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]

# ============================================================
# Complexity
# ============================================================

[tasks.complexity-report]
description = "Report complexity for review; metrics do not block delivery"
category = "Quality"
command = "lizard"
args = [
    "-l",
    "rust",
    "-C",
    "10",
    "-L",
    "80",
    "-a",
    "5",
    "--ignore_warnings",
    "-1",
    "src",
    "tests",
    "crates",
]

# ============================================================
# Documentation
# ============================================================

[tasks.docs-check]
description = "Validate Rust API documentation"
category = "Quality"
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
args = [
    "doc",
    "--workspace",
    "--all-features",
    "--no-deps",
]

# ============================================================
# Architecture
# ============================================================

[tasks.architecture-check]
description = "Validate architecture boundaries"
category = "Quality"
command = "uv"
args = [
    "run",
    "--quiet",
    "python",
    "scripts/check_architecture.py",
    "--config",
    "architecture.toml",
]

# ============================================================
# Coverage
# ============================================================

[tasks.coverage-generate]
description = "Generate LLVM coverage report"
category = "Test"
install_crate = { crate_name = "cargo-llvm-cov", binary = "cargo-llvm-cov", version = "0.9.0" }

command = "cargo"
args = [
    "llvm-cov",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--json",
    "--output-path",
    "target/coverage.json",
]

[tasks.coverage-check]
description = "Validate coverage thresholds"
category = "Test"
dependencies = ["coverage-generate"]

command = "uv"
args = [
    "run",
    "--quiet",
    "python",
    "scripts/check_coverage.py",
    "target/coverage.json",
    "--lines",
    "90",
    "--regions",
    "90",
]

# ============================================================
# Miri
# ============================================================

[tasks.miri-check]
description = "Run tests under Miri"
category = "Hardening"
install_crate = false
command = "cargo"
args = [
    "+nightly",
    "miri",
    "test",
    "--workspace",
    "--all-features",
]

# ============================================================
# AddressSanitizer (select the matching native platform explicitly)
# ============================================================

[tasks.asan-linux]
description = "Optional ASan tests for a native x86_64 Linux GNU host"
category = "Hardening"
env = { RUSTFLAGS = "-Zsanitizer=address", RUSTDOCFLAGS = "-Zsanitizer=address" }
command = "cargo"
args = [
    "+nightly", "test", "-Zbuild-std",
    "--target", "x86_64-unknown-linux-gnu", "--workspace", "--all-features",
]

[tasks.asan-windows]
description = "Optional ASan tests for a native x86_64 Windows MSVC host"
category = "Hardening"
env = { RUSTFLAGS = "-Zsanitizer=address", RUSTDOCFLAGS = "-Zsanitizer=address" }
command = "cargo"
args = [
    "+nightly", "test", "-Zbuild-std",
    "--target", "x86_64-pc-windows-msvc", "--workspace", "--all-features",
]

# ============================================================
# Mutation Testing
# ============================================================

[tasks.mutation-check]
description = "Run mutation testing"
category = "Hardening"

env = { RUSTFLAGS = "", RUSTDOCFLAGS = ""}

install_crate = { crate_name = "cargo-mutants", binary = "cargo-mutants", version = "27.1.0" }

command = "cargo"
args = [
    "mutants",
    "--all-features",
]

# ============================================================
# Tests and flows
# ============================================================

[tasks.test-targets]
description = "Run workspace unit, integration, and other target tests"
category = "Test"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features"]

[tasks.test-docs]
description = "Run workspace rustdoc examples and compile-fail tests"
category = "Test"
command = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]

[tasks.checker-tests]
description = "Test repository verification tools"
category = "Test"
command = "uv"
args = ["run", "--quiet", "python", "-m", "unittest", "discover", "-s", "scripts"]

[tasks.fast]
description = "Development checks without coverage instrumentation"
category = "Flow"
dependencies = [
    "format-check",
    "architecture-check",
    "checker-tests",
    "test-targets",
    "test-docs",
]

# Coverage runs the same target tests, so full does not also run test-targets.
[tasks.full]
description = "Final code validation, including coverage and checker tests"
category = "Flow"
dependencies = [
    "format-check",
    "clippy-check",
    "docs-check",
    "architecture-check",
    "checker-tests",
    "test-docs",
    "coverage-check",
]
