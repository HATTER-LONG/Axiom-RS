# Architecture boundary rules for Axiom-RS.
# scripts/check_architecture.py validates these facts; cargo-make only orchestrates.
# Layer names follow docs/development-plan.md.

[layer.foundation]
paths = ["src/foundation/**"]
may_depend_on = []

[layer.contract]
paths = ["src/contract/**"]
may_depend_on = ["foundation"]

[layer.execution]
paths = ["src/execution/**"]
may_depend_on = ["foundation"]

[layer.capability]
paths = ["src/capability/**"]
may_depend_on = ["foundation", "contract", "execution"]

[layer.runtime]
paths = ["src/runtime/**"]
may_depend_on = ["foundation", "contract", "execution", "capability"]

[layer.command]
paths = ["src/command/**"]
may_depend_on = ["foundation", "contract", "execution", "capability", "runtime"]

[layer.root]
paths = ["src/lib.rs"]
may_depend_on = [
    "foundation",
    "contract",
    "execution",
    "capability",
    "runtime",
    "command",
]

[layer.adapter_stdio]
paths = ["crates/axiom-stdio/src/**"]
may_depend_on = [
    "foundation",
    "contract",
    "execution",
    "capability",
    "runtime",
    "command",
]
